name: Validate dashboard
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Validate project structure and data JSON
        run: python scripts/validate_project.py
      - name: Compile Python and run unit tests
        run: |
          python -m compileall -q scripts tests
          python -m unittest discover -s tests -v
      - name: Validate dashboard JavaScript
        run: node --check assets/app.js
