name: DART 재무데이터 업데이트
on:
  schedule:
    - cron: '17 0 1 * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dart-financial-data-update
  cancel-in-progress: false
jobs:
  update-financials:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DART_API_KEY: ${{ secrets.DART_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Validate secret
        shell: bash
        run: |
          if [ -z "$DART_API_KEY" ]; then
            echo "DART_API_KEY Actions Secret is missing." >&2
            exit 1
          fi
      - name: Fetch and calculate financial data
        run: python scripts/update_financials.py
      - name: Commit updated datasets
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/financials.json data/hansem_dart_reports.json
          if git diff --cached --quiet; then
            echo "Dataset unchanged; no commit needed."
            exit 0
          fi
          git commit -m "chore: update DART financial data"
          git push
